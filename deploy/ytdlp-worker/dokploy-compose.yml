# Dokploy → Compose → Provider: Raw. Pulls the GitHub Actions-built image (no build on the 2C4G box).
# If pull fails with "unauthorized", add ghcr.io registry credentials in Dokploy or make the GHCR package public.
services:
  ytdlp-api:
    image: ghcr.io/zhamin246/videotranscriber/ytdlp-worker:latest
    pull_policy: always
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - YTDLP_IMPERSONATE=chrome
      # - COOKIE_PATH=/data/cookies.txt
      # - YTDLP_TOKEN=
    mem_limit: 1g
    cpus: "1.0"
