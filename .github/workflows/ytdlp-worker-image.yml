# Builds yt-dlp worker on GitHub (not on the 2C4G box). Image:
#   ghcr.io/zhamin246/videotranscriber/ytdlp-worker:latest
name: Publish yt-dlp worker image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "deploy/ytdlp-worker/**"
      - ".github/workflows/ytdlp-worker-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zhamin246/videotranscriber/ytdlp-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: deploy/ytdlp-worker
          file: deploy/ytdlp-worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
