# https://docs.github.com/zh/actions/use-cases-and-examples/publishing-packages/publishing-docker-images
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ['main']

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      # 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            # 基础信息（必需）
            NEXT_PUBLIC_WEB_URL=${{ secrets.NEXT_PUBLIC_WEB_URL }}
            NEXT_PUBLIC_PROJECT_NAME=${{ secrets.NEXT_PUBLIC_PROJECT_NAME }}
            # 支付回调地址
            NEXT_PUBLIC_PAY_SUCCESS_URL=${{ secrets.NEXT_PUBLIC_PAY_SUCCESS_URL }}
            NEXT_PUBLIC_PAY_FAIL_URL=${{ secrets.NEXT_PUBLIC_PAY_FAIL_URL }}
            NEXT_PUBLIC_PAY_CANCEL_URL=${{ secrets.NEXT_PUBLIC_PAY_CANCEL_URL }}
            # 认证相关
            NEXT_PUBLIC_AUTH_ENABLED=${{ secrets.NEXT_PUBLIC_AUTH_ENABLED }}
            NEXT_PUBLIC_AUTH_GOOGLE_ENABLED=${{ secrets.NEXT_PUBLIC_AUTH_GOOGLE_ENABLED }}
            NEXT_PUBLIC_AUTH_GOOGLE_ID=${{ secrets.NEXT_PUBLIC_AUTH_GOOGLE_ID }}
            NEXT_PUBLIC_AUTH_GOOGLE_ONE_TAP_ENABLED=${{ secrets.NEXT_PUBLIC_AUTH_GOOGLE_ONE_TAP_ENABLED }}
            NEXT_PUBLIC_AUTH_GITHUB_ENABLED=${{ secrets.NEXT_PUBLIC_AUTH_GITHUB_ENABLED }}
            # 其他配置
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
            NEXT_PUBLIC_DEFAULT_THEME=${{ secrets.NEXT_PUBLIC_DEFAULT_THEME }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ secrets.NEXT_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_LOCALE_DETECTION=${{ secrets.NEXT_PUBLIC_LOCALE_DETECTION }}
            # 可选功能（如果未启用可不配置）
            NEXT_PUBLIC_OPENPANEL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL=${{ secrets.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
            NEXT_PUBLIC_GOOGLE_ADCODE=${{ secrets.NEXT_PUBLIC_GOOGLE_ADCODE }}

      # Trigger redeploy on dokploy => project webhooks settings
      - name: Trigger dokploy redeploy
        run: |
          curl -X GET http://43.135.164.210:3000/api/deploy/_0Mz8C9MdJ8MYbX6-i3R8 || true
